<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>wp list - all in one wordpress, php, plugins, templates, etc.</title>
<link rel="icon" type="image/png" href="logo.png">
<style>
  :root {
    --bg: #0e1117; --panel: #161b24; --card: #1b2230; --border: #263043;
    --text: #e6ebf4; --muted: #8b96a9; --accent: #4f8cff; --accent2: #38d39f;
    --bad: #ff5d6c; --warn: #ffc857;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", Roboto, Arial, sans-serif; min-height: 100vh;
  }
  header {
    position: sticky; top: 0; z-index: 50;
    background: linear-gradient(180deg, #141a26 0%, #0e1117 100%);
    border-bottom: 1px solid var(--border);
    padding: 18px 24px 16px;
  }
  .wrap { max-width: 1280px; margin: 0 auto; }
  .head-row { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .logo {
    display: flex; align-items: center; gap: 11px;
    white-space: nowrap;
  }
  .logo-img {
    width: 38px; height: 38px; border-radius: 9px; object-fit: cover;
    display: block; background: var(--panel); border: 1px solid var(--border);
  }
  .logo .word {
    font-size: 30px; font-weight: 800; letter-spacing: .5px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .tagline { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
  .searchbox { position: relative; flex: 1 1 380px; min-width: 240px; }
  .searchbox input {
    width: 100%; padding: 12px 16px 12px 42px; font-size: 15px;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px; outline: none;
    transition: border-color .15s;
  }
  .searchbox input:focus { border-color: var(--accent); }
  .searchbox .icon {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    color: var(--muted); font-size: 16px; pointer-events: none;
  }
  .stats { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .stats b { color: var(--text); }
  main { padding: 20px 24px 60px; }
  #status-line { color: var(--muted); font-size: 13.5px; margin-bottom: 14px; min-height: 20px; }
  #grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    overflow: hidden; display: flex; flex-direction: column;
    transition: transform .12s, border-color .12s;
  }
  .card:hover { transform: translateY(-2px); border-color: var(--accent); }
  .cover-wrap { aspect-ratio: 4 / 3; background: #121826; position: relative; overflow: hidden; }
  .cover-wrap img { width: 100%; height: 100%; object-fit: contain; display: block; padding: 10px; }
  .cover-wrap .ph {
    width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 40px; font-weight: 800;
  }
  .cat-badge {
    position: absolute; top: 8px; left: 8px; font-size: 11px; font-weight: 600;
    background: rgba(13,17,25,.85); color: var(--accent2);
    border: 1px solid var(--border); border-radius: 20px; padding: 3px 10px;
  }
  .card-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .card-title {
    font-size: 14.5px; font-weight: 600; line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    min-height: 58px;
  }
  .card-title a { color: var(--text); text-decoration: none; }
  .card-title a:hover { color: var(--accent); }
  .btns { margin-top: auto; display: flex; gap: 8px; }
  .btn {
    border: none; border-radius: 8px; padding: 9px 12px; font-size: 13px; font-weight: 600;
    cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
    transition: filter .12s;
  }
  .btn:hover { filter: brightness(1.15); }
  .btn-dl {
    flex: 1; background: linear-gradient(90deg, var(--accent), var(--accent2));
    color: #06121a; justify-content: center;
  }
  .btn-ghost {
    background: var(--panel); color: var(--muted); border: 1px solid var(--border);
  }
  #more-wrap { text-align: center; margin-top: 26px; }
  #pager-wrap {
    display: flex; align-items: center; justify-content: center; gap: 18px; margin-top: 26px;
  }
  #pager-wrap .btn { padding: 10px 26px; font-size: 14px; }
  #pager-wrap .btn:disabled { opacity: .35; cursor: not-allowed; }
  #page-info { color: var(--muted); font-size: 13.5px; min-width: 130px; text-align: center; }
  #load-more { padding: 11px 34px; font-size: 14px; }
  .hidden { display: none !important; }
  #no-results { color: var(--muted); text-align: center; padding: 60px 0; }

  /* modal */
  #modal-backdrop {
    position: fixed; inset: 0; background: rgba(5,8,13,.72); z-index: 100;
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  #modal-backdrop.open { display: flex; }
  #modal {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    width: 100%; max-width: 620px; max-height: 84vh; display: flex; flex-direction: column;
    overflow: hidden;
  }
  #modal-head { padding: 16px 18px; border-bottom: 1px solid var(--border); display: flex; gap: 12px; align-items: flex-start; }
  #modal-head img { width: 74px; height: 56px; object-fit: cover; border-radius: 8px; background: #121826; }
  #modal-title { font-size: 15px; font-weight: 700; line-height: 1.4; }
  #modal-sub { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
  #modal-head .close { margin-left: auto; background: none; border: none; color: var(--muted); font-size: 22px; cursor: pointer; line-height: 1; }
  #modal-links { overflow-y: auto; padding: 10px 12px; }
  .mlink {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px; margin: 4px 0;
    border-radius: 9px; text-decoration: none; color: var(--text); font-size: 13px;
    background: var(--card); border: 1px solid var(--border); word-break: break-all;
  }
  .mlink:hover { border-color: var(--accent); }
  .mlink .badge {
    font-size: 10.5px; font-weight: 700; border-radius: 20px; padding: 2px 8px; white-space: nowrap;
  }
  .b-OK { background: rgba(56,211,159,.15); color: var(--accent2); }
  .b-BROKEN { background: rgba(255,93,108,.13); color: var(--bad); }
  .b-UNKNOWN { background: rgba(255,200,87,.13); color: var(--warn); }
  .mlink.dead { opacity: .55; }
  .mlink .host { color: var(--muted); font-size: 11.5px; white-space: nowrap; max-width: 34%; overflow: hidden; text-overflow: ellipsis; }
  #modal-empty { color: var(--muted); text-align: center; padding: 30px 0; font-size: 13.5px; }

  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="head-row">
      <div>
        <div class="logo"><img class="logo-img" src="logo.png" alt="wp list"><span class="word">wp&nbsp;list</span></div>
        <div class="tagline">all in one wordpress, php, plugins, templates, etc.</div>
      </div>
      <div class="searchbox">
        <span class="icon">&#128269;</span>
        <input id="search" type="search" placeholder="Search title or category&hellip; e.g. woocommerce, laravel, booking"
               autocomplete="off" spellcheck="false">
      </div>
      <div class="stats" id="stats"></div>
    </div>
  </div>
</header>

<main class="wrap">
  <div id="status-line"></div>
  <div id="grid"></div>
  <div id="no-results" class="hidden">No books match your search.</div>
  <div id="pager-wrap" class="hidden">
    <button id="prev-page" class="btn btn-ghost">&larr; Previous</button>
    <span id="page-info">Page 1</span>
    <button id="next-page" class="btn btn-ghost">Next &rarr;</button>
  </div>
</main>

<div id="modal-backdrop">
  <div id="modal">
    <div id="modal-head">
      <img id="modal-cover" src="" alt="">
      <div>
        <div id="modal-title"></div>
        <div id="modal-sub"></div>
      </div>
      <button class="close" id="modal-close" title="Close">&#10005;</button>
    </div>
    <div id="modal-links"></div>
    <div id="modal-empty" class="hidden">No download links found for this book.</div>
  </div>
</div>

<script>window.WPLIST_STATIC = true;</script>
<script>
(function () {
  "use strict";
  var LIMIT = 60;
  var STATIC = window.WPLIST_STATIC === true;
  var CATS = ["PHP Script", "WordPress Plugin", "Mobile App", "CMS", "Other"];
  var indexData = null;
  var pageCache = {};

  var offset = 0, total = 0, q = "", loading = false;
  var grid = document.getElementById("grid");
  var statusLine = document.getElementById("status-line");
  var searchInput = document.getElementById("search");
  var pagerWrap = document.getElementById("pager-wrap");
  var prevBtn = document.getElementById("prev-page");
  var nextBtn = document.getElementById("next-page");
  var pageInfo = document.getElementById("page-info");
  var noResults = document.getElementById("no-results");
  var modalEl = document.getElementById("modal-backdrop");
  var statusOrder = { "OK": 0, "UNKNOWN": 1, "BROKEN": 2 };

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function hostOf(u) {
    try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return u; }
  }
  function imgSrc(u) {
    return u ? (STATIC ? u : "/img?u=" + encodeURIComponent(u)) : "";
  }

  function card(b) {
    var cover = b.cover
      ? '<img src="' + esc(imgSrc(b.cover)) + '" loading="lazy" alt="' + esc(b.title) + '">'
      : '<div class="ph">&#128366;</div>';
    var okCount = b.downloads.filter(function (d) { return d.status === "OK"; }).length;
    var totalCount = b.downloads.length;
    var dlLabel = okCount > 0 ? "Download (" + okCount + ")" : (totalCount > 0 ? "Download" : "No links");
    var dlClass = okCount > 0 ? "btn-dl" : "btn-ghost";
    return '<div class="card">' +
      '<div class="cover-wrap"><div class="cat-badge">' + esc(b.category) + "</div>" + cover + "</div>" +
      '<div class="card-body">' +
        '<div class="card-title"><a href="' + esc(b.url) + '" target="_blank" rel="noopener">' + esc(b.title) + "</a></div>" +
        '<div class="btns">' +
          '<button class="btn ' + dlClass + '" data-open="' + b._idx + '">&#11015; ' + dlLabel + "</button>" +
          '<a class="btn btn-ghost" href="' + esc(b.url) + '" target="_blank" rel="noopener">&#8599;</a>' +
        "</div>" +
      "</div></div>";
  }

  function sortDownloads(dls) {
    return dls.slice().sort(function (a, b) { return statusOrder[a.status] - statusOrder[b.status]; });
  }

  function openModal(b) {
    document.getElementById("modal-cover").src = b.cover ? imgSrc(b.cover) : "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='74' height='56'><rect width='100%25' height='100%25' fill='%23121826'/></svg>";
    document.getElementById("modal-title").textContent = b.title;
    document.getElementById("modal-sub").textContent = b.category + "  \u00b7  " + b.downloads.length + " mirror link" + (b.downloads.length === 1 ? "" : "s");
    var box = document.getElementById("modal-links");
    box.innerHTML = "";
    document.getElementById("modal-empty").classList.toggle("hidden", b.downloads.length > 0);
    sortDownloads(b.downloads).forEach(function (d) {
      var dead = d.status === "BROKEN";
      var a = document.createElement("a");
      a.className = "mlink" + (dead ? " dead" : "");
      a.href = d.url;
      a.target = "_blank";
      a.rel = "noopener";
      a.innerHTML = '<span class="badge b-' + d.status + '">' + d.status + "</span>" +
        '<span class="host">' + esc(hostOf(d.url)) + "</span>" +
        "<span>" + esc(d.url) + "</span>";
      if (dead) {
        a.addEventListener("click", function (e) { e.preventDefault(); });
        a.title = "This link is dead (file not found).";
      }
      box.appendChild(a);
    });
    modalEl.classList.add("open");
  }

  function renderBooks(list, pageNo, totalPages) {
    grid.innerHTML = "";
    window.__books = [];
    var frag = document.createDocumentFragment();
    list.forEach(function (b) {
      b._idx = window.__books.length;
      window.__books.push(b);
      var tmp = document.createElement("div");
      tmp.innerHTML = card(b);
      frag.appendChild(tmp.firstElementChild);
    });
    grid.appendChild(frag);

    var from = offset + 1, to = offset + list.length;
    statusLine.textContent = (q ? 'Results for "' + q + '": ' : "") +
      from.toLocaleString() + "\u2013" + to.toLocaleString() + " of " + total.toLocaleString();
    pageInfo.textContent = "Page " + pageNo + " of " + totalPages;
    pagerWrap.classList.toggle("hidden", total === 0);
    prevBtn.disabled = pageNo <= 1;
    nextBtn.disabled = pageNo >= totalPages;
  }

  function loadIndex() {
    if (indexData) return Promise.resolve();
    return fetch("data/index.json").then(function (r) { return r.json(); }).then(function (d) {
      indexData = d;
      document.getElementById("stats").innerHTML =
        "<b>" + d.books.length.toLocaleString() + "</b> books";
    });
  }
  function getPageJson(n) {
    if (!pageCache[n]) {
      pageCache[n] = fetch("data/p" + n + ".json").then(function (r) { return r.json(); });
    }
    return pageCache[n];
  }

  function serverFetch(offsetNext) {
    return fetch("/api/search?q=" + encodeURIComponent(q) + "&offset=" + offsetNext + "&limit=" + LIMIT)
      .then(function (r) { return r.json(); })
      .then(function (d) {
        return { results: d.results || [], total: d.total || 0, error: d.error };
      });
  }

  function staticFetch(offsetNext) {
    if (!indexData) {
      return loadIndex().then(function () { return staticFetch(offsetNext); });
    }
    var ql = q.toLowerCase();
    var idx = indexData.books;
    var hits = [];
    for (var k = 0; k < idx.length; k++) {
      var b = idx[k];
      if (!ql || b.t.toLowerCase().indexOf(ql) >= 0 || indexData.cats[b.c].toLowerCase().indexOf(ql) >= 0) {
        hits.push(k);
      }
    }
    var slice = hits.slice(offsetNext, offsetNext + LIMIT);
    var pages = {};
    slice.forEach(function (k) { pages[idx[k].p] = 1; });
    var pkeys = Object.keys(pages).map(Number);
    return Promise.all(pkeys.map(getPageJson)).then(function () {
      var results = slice.map(function (k) {
        var b = idx[k];
        var pb = pageCache[b.p][b.i];
        return { title: pb.t, url: pb.u, cover: pb.c, category: CATS[pb.cat], downloads: pb.d };
      });
      return { results: results, total: hits.length };
    });
  }

  function fetchPageData(offsetNext) {
    return STATIC ? staticFetch(offsetNext) : serverFetch(offsetNext);
  }

  function fetchPage(offsetNext) {
    if (loading) return;
    loading = true;
    fetchPageData(offsetNext)
      .then(function (data) {
        loading = false;
        if (data.error) { statusLine.textContent = data.error; return; }
        offset = offsetNext;
        total = data.total;
        noResults.classList.toggle("hidden", data.results.length > 0);
        var pageNo = total === 0 ? 1 : Math.floor(offsetNext / LIMIT) + 1;
        var totalPages = Math.max(1, Math.ceil(total / LIMIT));
        renderBooks(data.results, pageNo, totalPages);
        if (data.results.length === 0) statusLine.textContent = "No books match your search.";
      })
      .catch(function (e) { loading = false; statusLine.textContent = "Network error."; console.error("wp_list fetch failed:", e); });
  }

  var debounce = null;
  searchInput.addEventListener("input", function () {
    clearTimeout(debounce);
    debounce = setTimeout(function () {
      q = searchInput.value.trim();
      fetchPage(0);
    }, 250);
  });

  nextBtn.addEventListener("click", function () {
    if (!nextBtn.disabled) fetchPage(offset + LIMIT);
  });
  prevBtn.addEventListener("click", function () {
    if (!prevBtn.disabled) fetchPage(Math.max(0, offset - LIMIT));
  });

  grid.addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-open]");
    if (btn) {
      var idx = parseInt(btn.getAttribute("data-open"), 10);
      var all = window.__books || [];
      var b = all[idx];
      if (b) openModal(b);
    }
  });
  grid.addEventListener("error", function (e) {
    var t = e.target;
    if (t && t.tagName === "IMG" && !t.dataset.err) {
      t.dataset.err = "1";
      t.outerHTML = '<div class="ph">&#128366;</div>';
    }
  }, true);

  document.getElementById("modal-close").addEventListener("click", function () { modalEl.classList.remove("open"); });
  modalEl.addEventListener("click", function (e) { if (e.target === modalEl) modalEl.classList.remove("open"); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") modalEl.classList.remove("open"); });

  if (STATIC) {
    loadIndex()
      .then(function () { fetchPage(0); })
      .catch(function (e) { statusLine.textContent = "data/index.json missing \u2014 upload the whole build folder."; console.error("wp_list index.json failed:", e); });
  } else {
    fetch("/api/stats").then(function (r) { return r.json(); }).then(function (d) {
      if (!d.error) {
        document.getElementById("stats").innerHTML =
          "<b>" + d.books.toLocaleString() + "</b> books \u00b7 <b>" + d.with_downloads.toLocaleString() + "</b> with links";
      }
    }).catch(function () {});
    fetchPage(0);
  }
})();
</script>
</body>
</html>
